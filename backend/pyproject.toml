[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-crisis-backend"
version = "0.1.0"
description = "Pulse — agentic urban crisis response backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "scipy>=1.13",
  "numpy>=1.26",
  "websockets>=12",
  "python-multipart>=0.0.9",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]
gemini = ["google-generativeai>=0.7"]

[tool.setuptools.packages.find]
include = ["app*"]
