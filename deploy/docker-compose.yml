version: '3.9'

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8080"
    environment:
      - PULSE_DEMO_OTP=654321
      # - GEMINI_API_KEY=set-this-to-enable-real-gemini
    volumes:
      - ../artifacts:/app/artifacts
      - ../pulse.db:/app/pulse.db
    restart: unless-stopped
